name: SPXVisuals Daily Run

# Run every day at 11:00 AM EST (16:00 UTC)
on:
  schedule:
    - cron: '16 0 * * *'
  workflow_dispatch:  # manual trigger option

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance matplotlib seaborn numpy tweepy

      # 4️⃣ Generate data and charts
      # IMPORTANT: run from repo root
      - name: Generate data and charts
        run: |
          cd SPXVisuals
          python generate_data.py
          
      # 5️⃣ Check if images exist
      - name: Check for images
        id: check_images
        run: |
          cd SPXVisuals
          shopt -s nullglob
          files=(output/normalized/*.png output/ma/*.png output/marketcap/*.png output/pe/*.png)
          if [ ${#files[@]} -gt 0 ]; then
            echo "Images found. Proceeding to post to X."
            echo "has_images=true" >> $GITHUB_OUTPUT
          else
            echo "No images found. Skipping posting to X."
            echo "has_images=false" >> $GITHUB_OUTPUT
          fi

      - name: Test Twitter auth
        run: |
          cd SPXVisuals
          python test_twitter_auth.py

      - name: Test basic tweet
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          cd SPXVisuals
          python test_tweet.py

      # 6️⃣ Post to X only if images exist
      - name: Post to X
        if: ${{ steps.check_images.outputs.has_images == 'true' }}
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_KEY_SECRET: ${{ secrets.TWITTER_API_KEY_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          cd SPXVisuals
          python post_to_x.py
